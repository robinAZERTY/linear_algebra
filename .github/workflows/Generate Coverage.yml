name: Generate Test Coverage Report

on:
    push:
        paths:
        - 'src/**'
        - 'include/**'
        - 'test/**'
        - '.github/workflows/Generate Coverage.yml'  # Déclenchement si le workflow change

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
            path: |
              ~/.cache/pip
              ~/.platformio/.cache
            key: ${{ runner.os }}-pio
      - uses: actions/setup-python@v5
        with:
            python-version: '3.11'
      - name: Install PlatformIO Core
        run: pip install --upgrade platformio

      - name: Install Specific Compiler
        run: sudo apt-get install -y gcc-11 g++-11 lcov

      - name: Set Compiler Path
        run: |
          export CC=/usr/bin/gcc-11
          export CXX=/usr/bin/g++-11

      - name: Compile with Coverage
        run: |
          platformio test --environment native

      - name: Capture Coverage Data
        run: |
          # Capturer toute la couverture
          lcov --capture --directory . --output-file coverage.info
          # Retirer les fichiers non pertinents (tests, PlatformIO, bibliothèques)
          lcov --remove coverage.info 'test/*' '*/.pio/*' --output-file coverage_filtered.info
          # Ne garder que include/ et src/
          lcov --extract coverage_filtered.info "*/include/*" "*/src/*" --output-file coverage_project.info
          # Lister les informations de couverture finales
          lcov --list coverage_project.info

      - name: Generate HTML Report
        run: |
          rm -rf docs/coverage_report
          mkdir -p docs/coverage_report
          genhtml coverage_project.info --output-directory docs/coverage_report

      - name: Commit Coverage Report
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'actions@github.com'
          git add docs/coverage_report/*
          git commit -m "Update coverage report" || echo "No changes to commit"
          git pull --rebase
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
